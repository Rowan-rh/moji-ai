services:
  moji-cloud:
    build: .
    container_name: moji-cloud-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MOJI_BIND_ADDR=0.0.0.0:8787
      - MOJI_DATA_DIR=/data
      - MOJI_TRUST_PROXY_HEADERS=${MOJI_TRUST_PROXY_HEADERS:-false}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"

